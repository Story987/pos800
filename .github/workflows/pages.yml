name: Build and Deploy

on:
  push:
    branches:
      - Novel
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdown converter
        run: npm install -g marked

      - name: Convert all .md files to .html
        run: |
          set -e
          # Находим все .md файлы в docs/
          find docs -type f -name "*.md" | while read md_file; do
            html_file="${md_file%.md}.html"
            echo "Конвертирую: $md_file → $html_file"

            # Извлекаем заголовок из первой строки # Заголовок
            title=$(head -n 1 "$md_file" | sed 's/^#\s*//')

            # Конвертируем markdown в HTML-фрагмент
            body=$(marked -i "$md_file")

            # Оборачиваем в шаблон
            cat > "$html_file" <<HTML
          <!DOCTYPE html>
          <html lang="ru">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>${title}</title>
          <style>
            :root { --bg:#0e0e10; --panel:#17171b; --text:#e8e8ea; --muted:#8a8a94; --accent:#d4a24a; --border:#2a2a30; }
            * { box-sizing: border-box; }
            body { font-family: Georgia, 'Times New Roman', serif; background: var(--bg); color: var(--text); line-height: 1.75; max-width: 780px; margin: 0 auto; padding: 48px 24px; }
            h1,h2,h3,h4 { color: var(--accent); font-weight: normal; letter-spacing: 0.02em; margin-top: 2em; margin-bottom: 0.6em; }
            h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
            h2 { font-size: 1.5em; } h3 { font-size: 1.2em; }
            p { margin: 1em 0; } a { color: var(--accent); }
            code { background: var(--panel); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
            pre { background: var(--panel); border: 1px solid var(--border); padding: 16px; border-radius: 6px; overflow-x: auto; }
            blockquote { border-left: 3px solid var(--accent); padding-left: 16px; color: var(--muted); font-style: italic; margin: 1.5em 0; }
            hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
            nav.back { font-family: system-ui, sans-serif; font-size: 0.9em; margin-bottom: 32px; }
            nav.back a { text-decoration: none; }
          </style>
          </head>
          <body>
          <nav class="back"><a href="/pos800/index.html">← к оглавлению</a></nav>
          ${body}
          </body>
          </html>
          HTML
          done
          echo "Готово. Сконвертированные файлы:"
          find docs -name "*.html" -newer docs | head -20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4₽